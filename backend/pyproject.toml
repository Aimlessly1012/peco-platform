[project]
name = "rag-coder-backend"
version = "0.1.0"
description = "RAG Coder — 代码 RAG 后台管理系统后端"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "neo4j>=5.26",
    "llama-index-core>=0.12",
    "llama-index-graph-stores-neo4j>=0.4",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "openai>=1.55",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
    "GitPython>=3.1",
    "cryptography>=44.0",
    "httpx>=0.28",
    "pathspec>=0.12",
    "sse-starlette>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: 需要 docker compose 环境（Neo4j/Postgres）的集成测试",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
