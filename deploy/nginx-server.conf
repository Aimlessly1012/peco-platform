# RAG Coder / peco-platform 服务器入口（M12 起自持 80/443）
#
# 域名 heitu.wang（DNSPod，@ 与 www 两条 A 记录 → 43.167.170.20）。
# 证书 Let's Encrypt，宿主机 certbot --webroot 签发，/etc/letsencrypt 与
# /var/www/certbot 由 compose 只读挂载进来；续期由 certbot.timer 自动跑，
# 续完 renewal-hooks/deploy/reload-nginx.sh 会 reload 本容器。
#
# 入口统一收敛到 https://heitu.wang：http 与 www 一律 301 过去（IP 直访同样
# 301——NextAuth 的回调地址只登记了主域，留 IP 入口只会做出一个登录必挂的站）。

# ---- 80：只留 ACME 验证，其余全部升 https ----
server {
    listen 80;
    server_name heitu.wang www.heitu.wang _;

    # certbot --webroot 的挑战文件。必须走 http 明文，不能重定向。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://heitu.wang$request_uri;
    }
}

# ---- 443 www：归一到裸域 ----
server {
    listen 443 ssl;
    server_name www.heitu.wang;

    ssl_certificate /etc/letsencrypt/live/heitu.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heitu.wang/privkey.pem;

    return 301 https://heitu.wang$request_uri;
}

# ---- 443 主站 ----
server {
    listen 443 ssl;
    http2 on;
    server_name heitu.wang;

    ssl_certificate /etc/letsencrypt/live/heitu.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heitu.wang/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Docker 内置 DNS。**必须显式声明它，并把上游写成变量**：
    # proxy_pass 里直接写容器名时，nginx 只在启动/reload 那一刻解析一次并永久缓存。
    # 平台容器一重建 IP 就变，nginx 还往旧地址发 → 全站 502，得手动 reload 才恢复
    # （实测踩过一次）。写成变量后 nginx 按 valid 周期重新解析，重建容器不再需要 reload。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- 作品集平台（peco-platform）----
    # 根路径与 /front、/login、/admin 等平台路由，以及 NextAuth 的 /api/auth/*。
    location / {
        set $platform_upstream http://peco-platform-platform-1:3000;
        proxy_pass $platform_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NextAuth 靠这个头判断回调地址的协议，缺了会在 https 后面拼出 http 回调
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- 后端 API（含 SSE 聊天流与 MCP 端点）----
    location /rag/api/ {
        # 同上：走变量 + resolver，backend 重建后不必 reload nginx。
        # 注意变量式 proxy_pass 不会自动剥前缀，要显式 rewrite 掉 /rag/api
        set $backend_upstream http://backend:8000;
        rewrite ^/rag/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        # SSE 三件套：缺任何一条聊天流式都会挂（M6 血泪）
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 索引轮询与长回答都可能拖很久，默认 60s 会中途断流
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 20m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
