# RAG Coder 服务器入口（M12：zc_erp 下线后自持 80 端口）
#
# 背景：M7 部署时 80 端口被 zc_erp 的 web 容器占着，RAG 的路由是寄在它的 nginx 里的。
# zc_erp 删除后由本配置接管 80，路径 /rag 保持不变（MCP 接入地址因此也不用改）。
#
# 上游用 compose 服务名而不是容器名：同一个 compose 项目内 DNS 直接可解析，
# 容器重建改名也不会断。

server {
    listen 80;
    server_name _;

    # 根路径暂时把人送去 /rag。**必须是 302 不能是 301**：
    # 作品集（heitu-platform）以后要占这里，301 会被浏览器永久缓存，
    # 到时候访客还会被强制弹去 /rag，且清不掉。
    location = / {
        return 302 /rag;
    }

    # ---- 后端 API（含 SSE 聊天流与 MCP 端点）----
    # 末尾双斜杠 = 剥掉 /rag/api 前缀：/rag/api/projects → 后端的 /projects
    location /rag/api/ {
        proxy_pass http://backend:8000/;

        # SSE 三件套：缺任何一条聊天流式都会挂（M6 血泪）
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 索引轮询与长回答都可能拖很久，默认 60s 会中途断流
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 20m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 前端页面 ----
    # 无尾斜杠：Next 的 basePath 会把 /rag/ 308 成 /rag，写成 /rag/ 会重定向死循环
    location /rag {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
