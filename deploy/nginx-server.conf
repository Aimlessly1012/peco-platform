# RAG Coder 服务器入口（M12：zc_erp 下线后自持 80 端口）
#
# 背景：M7 部署时 80 端口被 zc_erp 的 web 容器占着，RAG 的路由是寄在它的 nginx 里的。
# zc_erp 删除后由本配置接管 80，路径 /rag 保持不变（MCP 接入地址因此也不用改）。
#
# 上游用 compose 服务名而不是容器名：同一个 compose 项目内 DNS 直接可解析，
# 容器重建改名也不会断。

server {
    listen 80;
    server_name _;

    # ---- 作品集平台（peco-platform）----
    # 根路径与 /front、/login、/admin 等平台路由，以及 NextAuth 的 /api/auth/*。
    # 平台容器在 peco-platform 那套 compose 里，接入了本网络，故可用容器名直连。
    location / {
        proxy_pass http://peco-platform-platform-1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NextAuth 靠这个头判断回调地址的协议，缺了会在 https 后面拼出 http 回调
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- 后端 API（含 SSE 聊天流与 MCP 端点）----
    # 末尾双斜杠 = 剥掉 /rag/api 前缀：/rag/api/projects → 后端的 /projects
    location /rag/api/ {
        proxy_pass http://backend:8000/;

        # SSE 三件套：缺任何一条聊天流式都会挂（M6 血泪）
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 索引轮询与长回答都可能拖很久，默认 60s 会中途断流
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        client_max_body_size 20m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 旧的 RAG 独立前端已下线（M12 阶段二）----
    # /rag/* 现在是平台内部路由，落到上面的 location / 由 peco-platform 处理；
    # /rag/api/ 仍单独走上面那条转 FastAPI 的规则（前缀更长，优先匹配）。
}
