# 开发覆盖层：只加宿主端口映射。
#
# compose 的**默认发现**会自动叠加本文件（`cd deploy && docker compose up`），
# 而显式 `-f` 指定文件时不会加载它——实测确认过，所以生产那条命令拿不到这些端口。
#
# 为什么端口在覆盖层而不在 base：compose 的 ports 是追加语义，覆盖层删不掉 base 里
# 已有的映射（要 `!reset`，而服务器的 compose 版本未知，万一不支持就会静默保留
# 公网映射）。倒过来写则默认安全——base 没端口，忘加覆盖层最坏只是本地连不上。
services:
  db:
    ports:
      - "5433:5432"

  neo4j:
    ports:
      - "7474:7474"   # Browser
      - "7687:7687"   # Bolt

  backend:
    ports:
      - "9200:8000"   # 宿主 9200（本机 8000/8001 已被其他服务占用）

  rabbitmq:
    ports:
      - "5673:5672"   # 宿主 5672 常被别的项目占用，这里错开

  minio:
    ports:
      - "9100:9000"   # S3 API
      - "9101:9001"   # 控制台
