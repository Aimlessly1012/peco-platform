# RAG Coder / peco-platform 服务器入口（M12 起自持 80/443）
#
# 主域 baotao.wang（阿里云注册+解析，@ 与 www 两条 A 记录 → 43.167.170.20）。
# 旧域 heitu.wang（DNSPod）整站 301 过来，证书到期（2026-11）后若不续注册可整块删掉。
# 证书 Let's Encrypt，宿主机 certbot --webroot 签发，/etc/letsencrypt 与
# /var/www/certbot 由 compose 只读挂载进来；续期由 certbot.timer 自动跑，
# 续完 renewal-hooks/deploy/reload-nginx.sh 会 reload 本容器。
#
# 入口统一收敛到 https://baotao.wang：http、www、旧域、IP 直访一律 301 过去
# （NextAuth 的回调地址只登记了主域，留其他入口只会做出一个登录必挂的站）。

# ---- 80：只留 ACME 验证，其余全部升 https ----
server {
    listen 80;
    server_name baotao.wang www.baotao.wang heitu.wang www.heitu.wang _;

    # certbot --webroot 的挑战文件。必须走 http 明文，不能重定向。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://baotao.wang$request_uri;
    }
}

# ---- 443 www：归一到裸域 ----
server {
    listen 443 ssl;
    server_name www.baotao.wang;

    ssl_certificate /etc/letsencrypt/live/baotao.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baotao.wang/privkey.pem;

    return 301 https://baotao.wang$request_uri;
}

# ---- 443 旧域 heitu.wang：整站 301 到新域（旧证书还有效，先不断链接）----
server {
    listen 443 ssl;
    server_name heitu.wang www.heitu.wang;

    ssl_certificate /etc/letsencrypt/live/heitu.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heitu.wang/privkey.pem;

    return 301 https://baotao.wang$request_uri;
}

# ---- 443 主站 ----
server {
    listen 443 ssl;
    http2 on;
    server_name baotao.wang;

    ssl_certificate /etc/letsencrypt/live/baotao.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baotao.wang/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Docker 内置 DNS。**必须显式声明它，并把上游写成变量**：
    # proxy_pass 里直接写容器名时，nginx 只在启动/reload 那一刻解析一次并永久缓存。
    # 平台容器一重建 IP 就变，nginx 还往旧地址发 → 全站 502，得手动 reload 才恢复
    # （实测踩过一次）。写成变量后 nginx 按 valid 周期重新解析，重建容器不再需要 reload。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- 作品集平台（peco-platform）----
    # 根路径与 /front、/login、/admin 等平台路由，以及 NextAuth 的 /api/auth/*。
    location / {
        set $platform_upstream http://platform:3000;
        proxy_pass $platform_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NextAuth 靠这个头判断回调地址的协议，缺了会在 https 后面拼出 http 回调
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ---- 各项目的后端路由 ----
    # 一个项目一个文件，新增项目 = 新增 projects/<key>.conf，不改本文件。
    # 挂载点是 /etc/nginx/projects/ 而不是 conf.d/：后者会被 nginx 默认的
    # `include /etc/nginx/conf.d/*.conf` 当顶层配置加载，而这些是 location 片段。
    #
    # 顺序无关：nginx 的 location 按前缀最长匹配，`/rag/api/` 总会优先于上面的 `/`。
    include /etc/nginx/projects/*.conf;
}
