# RAG Coder 的后端路由。由主配置的 443 server 块 include 进来。
#
# 本文件是 location 片段，**不是**独立的 server 配置——所以它挂在
# /etc/nginx/projects/ 而不是 /etc/nginx/conf.d/：后者会被 nginx 默认的
# `include /etc/nginx/conf.d/*.conf` 当顶层配置加载进 http 块，
# 而 location 只能出现在 server 块里，那样会直接启动失败。
#
# 依赖主配置 server 块里的 `resolver 127.0.0.11`——变量式 proxy_pass 要靠它
# 按周期重新解析容器名。

# ---- 后端 API（含 SSE 聊天流与 MCP 端点）----
location /rag/api/ {
    # 走变量 + resolver，backend 重建后不必 reload nginx。
    # 注意变量式 proxy_pass 不会自动剥前缀，要显式 rewrite 掉 /rag/api
    set $backend_upstream http://backend:8000;
    rewrite ^/rag/api/(.*)$ /$1 break;
    proxy_pass $backend_upstream;

    # SSE 三件套：缺任何一条聊天流式都会挂（M6 血泪）
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 索引轮询与长回答都可能拖很久，默认 60s 会中途断流
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
