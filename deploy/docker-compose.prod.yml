# 生产覆盖层（M16 起改为 override 形式，此前是与开发栈并行的第二份完整定义）。
#
# 为什么改：两份完整定义会持续互相漂移——开发栈加个服务、改个环境变量，生产栈
# 不会自动跟上，而漂移只在部署那天暴露。现在它只声明「生产比基线多什么」，
# 服务定义全仓一份。
#
# 基线（deploy/docker-compose.yml + compose/*.yml）本身已经是生产安全的：
# 无宿主端口、无 restart。所以这里只加两件事：重启策略，以及 backend 的回环端口。
#
# 用法：
#   docker compose -f deploy/docker-compose.yml \
#                  -f deploy/docker-compose.prod.yml \
#                  -f deploy/docker-compose.server.yml up -d --build
#
# 别漏掉第一个 -f：prod.yml 已经不是完整定义，单独给它什么服务都起不来。
services:
  db:
    restart: unless-stopped

  neo4j:
    environment:
      # 4096 维向量；默认按 4G 小机保守配置，大内存服务器建议调到 2G/1G
      NEO4J_server_memory_heap_max__size: 768M
      NEO4J_server_memory_pagecache_size: 384M
    restart: unless-stopped
    # 需要开 Neo4j Browser 排查时临时加：ports: ["127.0.0.1:7474:7474"]

  backend:
    environment:
      # Nginx 已剥掉 /rag/api 前缀，这里只用于 openapi.json / docs 的地址生成
      ROOT_PATH: /rag/api
    ports:
      - "127.0.0.1:8001:8000"        # 只监听回环，公网流量必须过 Nginx
    restart: unless-stopped

  rabbitmq:
    restart: unless-stopped
    # 内存水位（192MiB）写在挂进去的 rabbitmq.conf 里：relative 会按宿主 3.6G 算，
    # 那样这里的 mem_limit 只会变成一记 OOM kill
    mem_limit: 256m

  minio:
    restart: unless-stopped
    mem_limit: 256m
    # 要开控制台排查时临时加：ports: ["127.0.0.1:9101:9001"]

  worker:
    restart: unless-stopped
    # 索引大仓时实测 400~600MB（design 内存账），768 留一档余量；
    # 超限被杀的只是 worker，任务由 acks_late 重投递续跑
    mem_limit: 768m

  platform:
    ports:
      # 只绑回环，公网流量一律经 nginx——与并入前的策略一致，不因换栈而放开。
      # 这一项原本写在 compose/platform.yml，M16 倒置端口后移来这里：
      # 基线零端口是**零例外**的规则，回环绑定也不例外——一旦允许「够安全就能留在
      # 基线」，每加一条都要判断什么算安全，而判断会出错。
      - "127.0.0.1:3200:3000"
    restart: unless-stopped
