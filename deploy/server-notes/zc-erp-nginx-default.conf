server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # ---- RAG Coder（M7 子路径接入；上游在宿主 127.0.0.1:8001/3300）----
    # 剥 /rag/api 前缀转发后端；SSE 三件套缺一聊天流式就挂
    location /rag/api/ {
        proxy_pass http://rag_coder-backend-1:8000/;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 20m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 无尾斜杠：Next basePath 会把 /rag/ 308 成 /rag，写 /rag/ 会重定向死循环
    location /rag {
        proxy_pass http://rag_coder-frontend-1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
