# peco 全栈伞文件（M16 合并后的统一入口）。
#
# 结构：本文件只放 include 列表 + 共享基础设施（Postgres），各项目一个文件放
# deploy/compose/ 下。这一步做到「按项目一个文件」即止——注册表、nginx 按项目
# 拆 conf.d、接入清单归后续的 platform-project-slots。
#
# 为什么 db 在这里而不在 rag.yml：平台与 RAG 共用同一个 Postgres（平台写
# platform_users，RAG 后端只读校验），它不属于任何单个项目。
#
# 项目名固定为 peco。注意**不要**为了让卷名对上而把项目名写成 rag_coder——
# 那是把第一个房客的名字刻在楼上，后续项目会全住在错误的命名空间里。
# 数据卷的原名由各文件里的卷级 `name:` 保证（见 rag.yml 的说明）。
#
# 本文件是**生产基线**：不含任何宿主端口映射，不含 restart 策略。
#
# 用法：
#   开发   cd deploy && docker compose up -d
#          （默认发现会自动叠加 docker-compose.override.yml，那里才有端口映射）
#   生产   docker compose -f deploy/docker-compose.yml \
#                        -f deploy/docker-compose.prod.yml \
#                        -f deploy/docker-compose.server.yml up -d
#          （显式 -f 时 compose **不会**自动加载 override，实测确认——
#            所以生产路径天然拿不到开发端口）
name: peco

include:
  - compose/rag.yml
  - compose/platform.yml

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raguser
      POSTGRES_PASSWORD: ragpass
      POSTGRES_DB: ragcoder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raguser -d ragcoder"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    name: rag_coder_pgdata
