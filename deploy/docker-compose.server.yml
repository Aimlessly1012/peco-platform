# 服务器 override（M12 起）：RAG 自持 80/443 端口的 nginx 入口。
#
# 历史：M7 部署时 80 被 zc_erp 占着，RAG 的路由寄在它的 nginx 里；zc_erp 下线后
# 入口收归自己。M12 阶段三前端并入 peco-platform，此处只剩 nginx。
# 2026-08-25 起纳入 git 仓库管理——此前是服务器专有文件，被一次 rsync --delete
# 误删过（server-notes 里那个坑的实锤），入库后 rsync 自然会带上它。
#
# 用法：docker compose -f docker-compose.prod.yml -f docker-compose.server.yml up -d
services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-server.conf:/etc/nginx/conf.d/default.conf:ro
      # HTTPS（baotao.wang）：证书与 ACME webroot 都在宿主机，certbot 续期后
      # 由 renewal-hooks/deploy 里的脚本 reload 本容器
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    restart: unless-stopped
    depends_on:
      - backend
