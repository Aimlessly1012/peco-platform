# RAG Coder 子路径反代片段（M7 D2）
#
# 用法：include 进已有站点的 server 块里（与其他项目共存），然后 nginx -t && nginx -s reload
#   server {
#       server_name your-domain.com;
#       ...你已有的 location...
#       include /path/to/RAG_coder/deploy/nginx-rag.conf;
#   }
#
# 换子路径：把本文件里的 /rag 全局替换成你要的前缀，并同步改
# docker-compose.prod.yml 里的 NEXT_PUBLIC_BASE_PATH / NEXT_PUBLIC_API_BASE / ROOT_PATH。

# ---- 后端 API（含 SSE 聊天流与 MCP 端点）----
# 末尾斜杠 + proxy_pass 末尾斜杠 = 剥掉 /rag/api 前缀再转发：
#   /rag/api/projects  →  后端的 /projects
#   /rag/api/mcp       →  后端的 /mcp
location /rag/api/ {
    proxy_pass http://127.0.0.1:8001/;

    # —— SSE 三件套：缺任何一条，聊天流式都会挂 ——
    # 1) 关缓冲：Nginx 默认会把上游响应攒够一块再发，SSE 就变成"一直转圈然后整段蹦出来"
    proxy_buffering off;
    # 2) 关缓存：事件流不可缓存，缓存中间件会吃掉后续事件
    proxy_cache off;
    # 3) HTTP/1.1 且清空 Connection：默认 1.0 + Connection: close 会掐断长连接
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 索引任务轮询与长回答都可能拖很久，默认 60s 会中途断流
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # 上传 git token / 大 payload 时别被默认 1m 卡住
    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ⚠️ MCP 端点走的就是这条 location。后端有 DNS 重绑定防护，
    #    Host 是域名而白名单里没有时会返回 421 —— 必须在 .env 里把域名加进
    #    MCP_ALLOWED_HOSTS（见 DEPLOY.md「MCP 远程接入」）。
}

# ---- 前端页面 ----
# 不剥前缀：Next.js 自己带 basePath=/rag，它期望收到完整的 /rag/... 路径
# （proxy_pass 结尾没有斜杠 = 原样透传 URI）
#
# ⚠️ location 必须写 /rag（无尾斜杠）：Next basePath 会把 /rag/ 308 回 /rag，
#    若这里写成 /rag/，nginx 对 /rag 的补斜杠 301 会与之形成重定向死循环（实测）。
#    无尾斜杠前缀也会匹配 /ragxxx 这类路径——本项目没有此类路由，误匹配交给 Next 404，无害。
location /rag {
    proxy_pass http://127.0.0.1:3300;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;      # Next dev/HMR 与将来可能的 WS
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_read_timeout 300s;
}
