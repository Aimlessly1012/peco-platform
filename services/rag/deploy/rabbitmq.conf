# RabbitMQ 内存护栏（M13 D7）。
#
# 挂到容器的 /etc/rabbitmq/conf.d/ —— 官方镜像自己就用这个目录放默认配置
# （镜像内已有 10-defaults.conf），按文件名字典序加载，我们的文件排在后面生效。
#
# 为什么必须是 absolute 而不是 relative：
#   官方镜像 README 明确写了 vm_memory_high_watermark.relative 是按「宿主总内存」
#   算的，不认 cgroup 限制。3.6G 的机器上 0.4 relative ≈ 1.4G，compose 的
#   mem_limit: 256m 会先一步把容器 OOM kill —— 内存告警根本来不及触发。
#
# 为什么不用环境变量：
#   RABBITMQ_VM_MEMORY_HIGH_WATERMARK 自 3.9 起已废弃，官方镜像的 entrypoint
#   检测到它会直接报错退出（exit 1）。别改回 env 写法。
vm_memory_high_watermark.absolute = 192MiB
