# peco-platform 生产编排。
#
# 平台自己不带数据库：接入 RAG_coder 那套 compose 的网络，直接用服务名 db 连它的
# Postgres（两边共用一个库，平台写 platform_users，RAG 后端只读校验）。
#
# 启动前提：RAG_coder 的 compose 已经起着（提供 rag_coder_default 网络与 db 服务）。
# 启动：docker compose up -d --build
networks:
  rag_coder_default:
    external: true

services:
  platform:
    build: .
    env_file: .env.production
    environment:
      NODE_ENV: production
    ports:
      # 只绑回环，公网流量一律经 nginx（nginx 在 RAG 那套 compose 里）
      - "127.0.0.1:3200:3000"
    restart: unless-stopped
    networks:
      - rag_coder_default
